name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test pure learning logic
        run: npm run test:unit
      - name: Build static site
        run: npm run build
      - name: Install Chromium for interaction smoke test
        run: npx playwright install --with-deps chromium
      - name: Test core learner interactions, themes and language in Chromium
        # Keep each LIVE Unit A lesson, curriculum surface and bilingual route contract in this explicit smoke path until coverage is reorganized deliberately.
        run: npx playwright test tests/e2e/course.spec.ts tests/e2e/higgs-hunt.spec.ts tests/e2e/histogram-binning.spec.ts tests/e2e/histogram-fill.spec.ts tests/e2e/histogram-compare.spec.ts tests/e2e/theme.spec.ts tests/e2e/i18n.spec.ts --project=chromium
